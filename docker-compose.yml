# Прод-развёртывание: приложение + PostgreSQL.
# Значения секретов берутся из файла .env рядом с этим compose (см. .env.deploy.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finansist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: finansist
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finansist"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://finansist:${POSTGRES_PASSWORD}@db:5432/finansist
      AUTH_SECRET: ${AUTH_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MENTOR_PROXY_URL: ${MENTOR_PROXY_URL}
      MENTOR_MODEL: ${MENTOR_MODEL:-gemini-3.6-flash}
    ports:
      # Сайт будет доступен на http://<ip-сервера>  (порт 80 → приложение 3000)
      - "80:3000"

volumes:
  pgdata:
