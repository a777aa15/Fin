# Прод-развёртывание: приложение + PostgreSQL.
# Значения секретов берутся из файла .env рядом с этим compose (см. .env.deploy.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finansist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: finansist
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finansist"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://finansist:${POSTGRES_PASSWORD}@db:5432/finansist
      AUTH_SECRET: ${AUTH_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MENTOR_PROXY_URL: ${MENTOR_PROXY_URL}
      MENTOR_MODEL: ${MENTOR_MODEL:-gemini-3.6-flash}
      # За HTTPS (Caddy) — Secure-куку можно включить. Для HTTP-режима без домена
      # переопределите COOKIE_SECURE=false в .env.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # E-mail(ы) администраторов через запятую — авто-доступ + панель /admin.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    expose:
      - "3000"

  # Reverse-proxy с авто-HTTPS (Let's Encrypt). Требует, чтобы домен из Caddyfile
  # указывал A-записью на этот сервер, и были открыты порты 80/443.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
